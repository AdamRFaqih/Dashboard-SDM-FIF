services:
  # Nginx Web Server
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: dashboard-sdm-nginx
    restart: unless-stopped
    ports:
      # Default 8083 avoids existing port conflicts (80, 443, 8000, 8080, 8081, 8082)
      - "${APP_PORT:-8083}:80"
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      - app
    networks:
      - dashboard-network

  # Laravel App (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dashboard-sdm-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      - mysql
      - redis
    networks:
      - dashboard-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: dashboard-sdm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dashboard_sdm}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # Bound to 127.0.0.1 so it is not exposed directly to the public internet
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks:
      - dashboard-network

  # Redis Cache & Sessions
  redis:
    image: redis:alpine
    container_name: dashboard-sdm-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      # Bound to 127.0.0.1 for local server access only
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - dashboard-network

networks:
  dashboard-network:
    name: dashboard-sdm-network
    driver: bridge

volumes:
  mysql-data:
    name: dashboard-sdm-mysql-data
  redis-data:
    name: dashboard-sdm-redis-data
  storage-data:
    name: dashboard-sdm-storage-data
